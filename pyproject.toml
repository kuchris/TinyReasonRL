[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyreasonrl"
version = "0.1.0"
description = "Direct RL on verifiable Countdown arithmetic tasks"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.9", "transformers>=5.2", "trl>=0.28", "peft>=0.18",
  "datasets>=4", "accelerate>=1.12", "tensorboard", "matplotlib", "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
